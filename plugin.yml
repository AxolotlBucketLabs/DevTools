name: DevTools
version: 2.1.1
main: NhanAZ\DevTools\DevTools
api: 5.0.0
load: STARTUP
src-namespace-prefix: NhanAZ\DevTools
description: Folder loading, shared development virions and standalone plugin or virion PHAR tooling for Axolotl-PM
author: NhanAZ
website: https://github.com/NhanAZ/DevTools
commands:
  devtools:
    description: Inspect and build development plugins and virions
    usage: "/devtools <status|doctor|build|extract|virions>"
    aliases: [makeplugin, extractplugin]
    permission: devtools.command
permissions:
  devtools.command:
    description: Allows all DevTools administrative commands
    default: op
  devtools.command.status:
    description: Allows viewing DevTools status
    default: op
  devtools.command.doctor:
    description: Allows running DevTools diagnostics
    default: op
  devtools.command.build:
    description: Allows building plugin and virion PHARs
    default: op
  devtools.command.extract:
    description: Allows extracting plugin and virion artifacts
    default: op
  devtools.command.virions:
    description: Allows viewing the shared virion registry
    default: op
