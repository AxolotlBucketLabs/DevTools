version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        update-types:
          - "patch"
          - "minor"
  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: axolotl-pm/pocketmine-mp
    groups:
      composer-development:
        dependency-type: development
        update-types:
          - "patch"
          - "minor"
      composer-production:
        dependency-type: production
        update-types:
          - "patch"
          - "minor"
