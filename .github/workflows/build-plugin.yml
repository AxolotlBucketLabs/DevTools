name: Build and validate plugin or virion PHAR

on:
  workflow_call:
    inputs:
      axolotl-ref:
        description: Optional Axolotl-PM Git ref (release tag, branch, or full commit SHA) to check out for PHPStan.
        required: false
        default: ''
        type: string
      prepare-dependencies:
        description: Explicitly install locked Composer runtime dependencies and prepare supported virions.
        required: false
        default: false
        type: boolean
      php-version:
        description: PHP version supplied by axolotl-pm/setup-php-action.
        required: false
        default: '8.4'
        type: string
      pm-version-major:
        description: Axolotl-PM server major version supplied by the PHP setup helper.
        required: false
        default: '5'
        type: string
      project:
        description: Plugin project path relative to the checked-out repository.
        required: false
        default: .
        type: string
      type:
        description: Artifact type to build. Use plugin for this workflow or virion for a shared library.
        required: false
        default: plugin
        type: string
      virions:
        description: Local virion directory relative to the checked-out repository.
        required: false
        default: virions
        type: string
      output:
        description: Build output directory relative to the checked-out repository.
        required: false
        default: build
        type: string
      overwrite:
        description: Replace an existing PHAR in the output directory.
        required: false
        default: false
        type: boolean
      phpstan:
        description: PHPStan level 0 through 10 or max. Use off to keep analysis disabled.
        required: false
        default: 'off'
        type: string
      phpstan-server:
        description: Newline-separated local server source checkouts for independent PHPStan analysis.
        required: false
        default: ''
        type: string
      phpstan-paths:
        description: Newline-separated local source directories for plugin or library symbols.
        required: false
        default: ''
        type: string
      artifact-name:
        description: Uploaded artifact name. Defaults to <plugin-name>-<commit-sha>.
        required: false
        default: ''
        type: string
    outputs:
      sha256:
        description: SHA-256 of the built PHAR.
        value: ${{ jobs.build.outputs.sha256 }}
      plugin-name:
        description: Backward-compatible identity name output for the built artifact.
        value: ${{ jobs.build.outputs.plugin-name }}
      plugin-version:
        description: Backward-compatible identity version output for the built artifact.
        value: ${{ jobs.build.outputs.plugin-version }}
      artifact-name:
        description: Name of the uploaded PHAR artifact.
        value: ${{ jobs.build.outputs.artifact-name }}
      artifact-id:
        description: Immutable ID of the uploaded PHAR artifact.
        value: ${{ jobs.build.outputs.artifact-id }}
      artifact-type:
        description: Artifact type from the build result.
        value: ${{ jobs.build.outputs.artifact-type }}
      source-name:
        description: Source artifact name from the build result.
        value: ${{ jobs.build.outputs.source-name }}
      source-version:
        description: Source artifact version from the build result.
        value: ${{ jobs.build.outputs.source-version }}

permissions:
  contents: read

jobs:
  build:
    name: Build PHAR
    runs-on: ubuntu-24.04
    outputs:
      plugin-name: ${{ steps.devtools.outputs.plugin-name }}
      plugin-version: ${{ steps.devtools.outputs.plugin-version }}
      artifact-name: ${{ steps.metadata.outputs.artifact-name }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      sha256: ${{ steps.devtools.outputs.sha256 }}
      artifact-type: ${{ steps.devtools.outputs.artifact-type }}
      source-name: ${{ steps.devtools.outputs.artifact-name }}
      source-version: ${{ steps.devtools.outputs.artifact-version }}
    steps:
      - name: Verify the reusable workflow revision
        id: workflow-identity
        shell: bash
        env:
          JOB_CONTEXT: ${{ toJSON(job) }}
        run: |
          WORKFLOW_SHA="$(jq -r '.workflow_sha // empty' <<< "$JOB_CONTEXT")"
          WORKFLOW_REPOSITORY="$(jq -r '.workflow_repository // empty' <<< "$JOB_CONTEXT")"
          if [[ ! "$WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ || ! "$WORKFLOW_REPOSITORY" =~ ^[^/]+/[^/]+$ ]]; then
            echo "GitHub did not provide an immutable reusable workflow identity." >&2
            exit 2
          fi
          printf 'sha=%s\nrepository=%s\n' "$WORKFLOW_SHA" "$WORKFLOW_REPOSITORY" >> "$GITHUB_OUTPUT"

      - name: Check out project source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Check out selected Axolotl-PM source
        if: inputs.axolotl-ref != ''
        uses: actions/checkout@v7.0.1
        with:
          repository: axolotl-pm/PocketMine-MP
          ref: ${{ inputs.axolotl-ref }}
          path: .devtools-dependencies/axolotl-pm
          persist-credentials: false

      - name: Select PHPStan server sources
        id: analysis-sources
        shell: bash
        env:
          AXOLOTL_REF: ${{ inputs.axolotl-ref }}
          EXTRA_SERVER_SOURCES: ${{ inputs.phpstan-server }}
        run: |
          if [ -z "$AXOLOTL_REF" ] && [ -z "$EXTRA_SERVER_SOURCES" ]; then
            echo 'paths=' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo 'paths<<EOF'
            if [ -n "$AXOLOTL_REF" ]; then
              echo '.devtools-dependencies/axolotl-pm'
            fi
            if [ -n "$EXTRA_SERVER_SOURCES" ]; then
              printf '%s\n' "$EXTRA_SERVER_SOURCES"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Check out the selected DevTools revision
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ steps.workflow-identity.outputs.repository }}
          ref: ${{ steps.workflow-identity.outputs.sha }}
          path: .devtools-dependencies/tool
          persist-credentials: false

      - name: Check out Axolotl-PM PHP setup helper
        uses: actions/checkout@v7.0.1
        with:
          repository: axolotl-pm/setup-php-action
          ref: b8c3f9add4f2ad4a5e2624a1112aba899ee8db0e
          path: .devtools-dependencies/setup-php-action
          persist-credentials: false

      - name: Set up Axolotl-PM PHP on Node.js 24
        shell: bash
        env:
          INPUT_PHP-VERSION: ${{ inputs.php-version }}
          INPUT_PM-VERSION-MAJOR: ${{ inputs.pm-version-major }}
          INPUT_INSTALL-PATH: ./.php-bin
          PHP_VERSION: ${{ inputs.php-version }}
          PM_VERSION_MAJOR: ${{ inputs.pm-version-major }}
          INSTALL_PATH: ./.php-bin
        run: |
          if node "$GITHUB_WORKSPACE/.devtools-dependencies/setup-php-action/dist/index.js"; then
            exit 0
          fi
          bash .devtools-dependencies/tool/.github/scripts/setup-axolotl-php-fallback.sh "$PHP_VERSION" "$PM_VERSION_MAJOR" "$INSTALL_PATH"

      - name: Verify checked-out builder identity and CLI contract
        shell: bash
        env:
          DEVTOOLS_REF: ${{ steps.workflow-identity.outputs.sha }}
        run: |
          set -euo pipefail
          CHECKED_OUT_COMMIT="$(git -C .devtools-dependencies/tool rev-parse HEAD)"
          EXPECTED_COMMIT="$(git -C .devtools-dependencies/tool rev-parse "$DEVTOOLS_REF^{commit}")"
          test "$CHECKED_OUT_COMMIT" = "$EXPECTED_COMMIT"
          if [ ! -f .devtools-dependencies/tool/bin/devtools.php ] || [ ! -f .devtools-dependencies/tool/.github/scripts/artifact-contract.mjs ]; then
            echo "Selected DevTools commit does not provide the required CLI metadata contract. Pin the same commit as this workflow revision." >&2
            exit 1
          fi

      - name: Build standalone PHAR
        id: devtools
        uses: ./.devtools-dependencies/tool
        with:
          prepare-dependencies: ${{ inputs.prepare-dependencies }}
          type: ${{ inputs.type }}
          project: ${{ inputs.project }}
          virions: ${{ inputs.virions }}
          output: ${{ inputs.output }}
          overwrite: ${{ inputs.overwrite }}
          phpstan: ${{ inputs.phpstan }}
          phpstan-server: ${{ steps.analysis-sources.outputs.paths }}
          phpstan-paths: ${{ inputs.phpstan-paths }}

      - name: Inspect built PHAR archive
        shell: bash
        env:
          PROJECT_PATH: ${{ inputs.project }}
          BUILD_PHAR: ${{ steps.devtools.outputs.phar }}
        run: php .devtools-dependencies/tool/bin/devtools.php inspect --project="$PROJECT_PATH" --artifact="$BUILD_PHAR" --json

      - name: Read artifact metadata
        id: metadata
        shell: bash
        env:
          INPUT_ARTIFACT_NAME: ${{ inputs.artifact-name }}
          INPUT_ARTIFACT_NAME_FROM_BUILD: ${{ steps.devtools.outputs.artifact-name }}
          BUILD_METADATA: ${{ steps.devtools.outputs.metadata }}
          BUILD_PHAR: ${{ steps.devtools.outputs.phar }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/devtools-artifact"
          cp "$BUILD_METADATA" "$RUNNER_TEMP/devtools-artifact/build-metadata.json"
          cp "$BUILD_PHAR" "$RUNNER_TEMP/devtools-artifact/"
          if [ -n "$INPUT_ARTIFACT_NAME" ]; then
            ARTIFACT_NAME="$INPUT_ARTIFACT_NAME"
          else
            ARTIFACT_NAME="${INPUT_ARTIFACT_NAME_FROM_BUILD}-${GITHUB_SHA}"
          fi

          if [[ "$ARTIFACT_NAME" == *$'\n'* || "$ARTIFACT_NAME" == *$'\r'* ]]; then
            echo "artifact-name must be a single-line value." >&2
            exit 2
          fi
          printf 'artifact-name=%s\n' "$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload PHAR artifact
        id: upload
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ steps.metadata.outputs.artifact-name }}
          path: ${{ runner.temp }}/devtools-artifact/
          if-no-files-found: error
