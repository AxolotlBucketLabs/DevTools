# Use auto to follow Axolotl-PM's selected language, or set one of the locale
# codes documented in docs/configuration.md.
language: auto

# Allow matching source folders from virions/ during server development.
# Composer preparation remains required for builds and doctor checks.
virions:
  allow-local-composer: true

# Server-side operations that can scan, transform or write project files.
# Disable these on production servers that only need folder loading and shared virions.
commands:
  doctor: true
  build: true
  extract: true

# Detailed diagnostics are disabled by default. When enabled, output is still
# subject to Axolotl-PM's own debug logging level.
logging:
  debug: false
